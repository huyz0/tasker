version: 3

# TEMPLATE. Copied to `.specs/product/work-ledger.yml` by /work-ledger-define.
#
# Where every SDD artifact lives, and whether it lives in git or in an external
# tracker. Resolved by `.agents/protocols/work-ledger.md` before any read or
# write — nothing hardcodes a path.
#
# v3 removed the `epics` type. Delivery runs through `.milestones/`, which
# carries the session-resume contract epics never had; the design artifacts that
# used to justify an epic wrapper (ADRs, UX, test plans, reviews) now hang off
# the milestone task that needs them, or off `.specs/` when they outlive it.

milestones:
  type: project_files
  config:
    project_files:
      path: .milestones/
      name_template: MILESTONE.md
      state_file: .milestones/STATE.md
      progress_template: PROGRESS.md

# Decisions outlive the work that prompted them, so they sit beside the other
# specs rather than inside an artifact that gets archived.
architecture_design:
  type: project_files
  config:
    project_files:
      path: .specs/adr/
      name_template: ADR-{4_digit_id}-{kebab_title}.md

test_plan:
  type: project_files
  config:
    project_files:
      path: .test-plans/TEST-PLAN-{4_digit_id}-{kebab_title}/
      name_template: TEST-PLAN.md

ux_design:
  type: project_files
  config:
    project_files:
      path: .milestones/{milestone_id}/design/
      name_template: UX-DESIGN.md

# Reviews are versioned, never overwritten: the trace of what was rejected and
# why is the audit trail.
reviews:
  type: project_files
  config:
    project_files:
      path: .milestones/{milestone_id}/reviews/
      name_templates:
        architecture: ARCH-REVIEW-v{N}.md
        ux: UX-REVIEW-v{N}.md
        qa_plan: QA-PLAN-REVIEW-v{N}.md
        qa_implement: QA-REVIEW-v{N}.md
        architecture_code: ARCH-CODE-REVIEW-v{N}.md
        security: SECURITY-REVIEW-v{N}.md
        code: CODE-REVIEW-v{N}.md
