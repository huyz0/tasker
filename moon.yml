$schema: https://moonrepo.dev/schemas/project.json
language: system

tasks:
  dev:
    deps:
      - 'shared-contract:install-deps'
    command: 'bash scripts/dev.sh'
    options:
      cache: false
      persistent: true

  # A fresh clone has core.hooksPath unset, so git ignores .githooks/ entirely
  # and the pre-commit checks never run for anyone who has not wired them up by
  # hand. Point git at the committed hooks directory instead of copying files
  # into .git/hooks, so an updated hook takes effect on pull.
  setup-hooks:
    # A one-time local setup action, not a check - `type: run` keeps it out of
    # `moon check`, which the hook itself invokes.
    type: 'run'
    command: 'git config core.hooksPath .githooks'
    options:
      cache: false
      runInCI: false

  # Fails the build on unused files, dependencies and exports. Part of the root
  # project's task set, so `moon check --all` includes it.
  knip:
    deps:
      - 'shared-contract:install-deps'
    command: 'bunx knip'
    inputs:
      - 'knip.json'
      - 'package.json'
      - 'apps/**/*.{ts,tsx}'
      - 'apps/**/package.json'
      - 'packages/**/package.json'
      # knip analyses `scripts/` too, so a change there has to invalidate this
      # task's cache. Without this line the cache went stale the moment a
      # script was added: `moon check --all` was green locally off a cached
      # result while CI, which has no cache, ran it for real and failed
      # (M27 follow-up).
      - 'scripts/**/*.ts'

  # Deterministic gate on the agent harness itself: skill structure, tier-0/1
  # budgets, dead path references, host-adapter parity, standards-index drift.
  # Zero dependencies, so it needs no install step. Part of the root project's
  # task set, so `moon check --all` includes it.
  # The gates that guard every skill are themselves 1,151 lines of script. Three
  # of their rules were wrong when first checked by hand, so the suite runs
  # before the gate does: every rule must be provably capable of failing.
  skills-check:
    command: 'bash -c "node --test .agents/skills/skill-forge/scripts/*.test.mjs && node .agents/skills/skill-forge/scripts/validate.mjs && node .agents/skills/skill-forge/scripts/sync-adapters.mjs --check"'
    inputs:
      - '/.agents/**/*'
      - '/.claude/**/*'
      - '/.specs/standards/**/*'
      - '/AGENTS.md'

  # Markdown is the substrate of this whole system — skills, protocols, specs and
  # milestones are all prose that agents execute. It stayed advisory while it
  # reported 615 errors; now that the conventions are recorded in
  # `.markdownlint-cli2.jsonc` and the tree is clean, it can hold the line.
  # `.specs/` is only a source of truth if something breaks when it stops being
  # true. This is that something: it compares every declared manifest identifier
  # against the "In Use" tables of tech-stack.md, in both directions. Its own
  # suite runs first — the rules that decide whether the specs are honest have to
  # be provably capable of failing, same as `skills-check`.
  # Fails when README.md, architecture.md, mission.md or NAVIGATION.md say a
  # closed milestone still owes work (M27, ADR-0024). Same shape as
  # `spec-drift` and for the same reason: `tech-stack.md` was the only one of
  # the ground-truth documents that stayed honest, and the only one with a
  # gate. Its own suite runs first — a rule that cannot be made to fail
  # enforces nothing.
  doc-drift:
    command: 'bash -c "bun test scripts/doc-drift.test.ts && bun run scripts/doc-drift.ts"'
    inputs:
      - '/scripts/doc-drift.ts'
      - '/scripts/doc-drift.test.ts'
      - '/README.md'
      - '/.specs/product/architecture.md'
      - '/.specs/product/mission.md'
      - '/.specs/design/NAVIGATION.md'
      - '/.milestones/STATE.md'

  spec-drift:
    deps:
      - 'shared-contract:install-deps'
    command: 'bash -c "bun test scripts/spec-drift.test.ts && bun run scripts/spec-drift.ts"'
    inputs:
      - '/scripts/spec-drift.ts'
      - '/scripts/spec-drift.test.ts'
      - '/package.json'
      - '/apps/*/package.json'
      - '/packages/*/package.json'
      - '/apps/cli/go.mod'
      - '/.prototools'
      - '/.specs/product/tech-stack.md'

  docs-lint:
    deps:
      - 'shared-contract:install-deps'
    command: 'node .agents/skills/markdown-lint/scripts/lint-markdown.mjs'
    inputs:
      - '/.agents/**/*.md'
      - '/.claude/**/*.md'
      - '/.specs/**/*.md'
      - '/.milestones/**/*.md'
      - '/*.md'
      - '/apps/*/*.md'
      - '/packages/*/*.md'
      - '/.markdownlint-cli2.jsonc'

  run-local-ci:
    command: 'bash -c "if .agents/skills/local-ci-run/scripts/check.sh >/dev/null 2>&1; then .agents/skills/local-ci-run/scripts/run.sh push; else echo \"⚠️ gh cli or act plugin not installed. Skipping local CI.\"; fi"'
    inputs:
      - '/.github/workflows/**/*'
      - '/apps/**/*'
      - '/packages/**/*'
      - '/.agents/skills/local-ci-run/scripts/**/*'
    options:
      cache: true
