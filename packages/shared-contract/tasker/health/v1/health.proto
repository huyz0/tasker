message Comment {
  string id = 1;
  string entityId = 2;
  string entityType = 3;
  string userId = 4;
  string agentId = 5;
  string content = 6;
  string createdAt = 7;
  optional string authorName = 8;
}

message CreateCommentRequest {
  string entityId = 1;
  string entityType = 2;
  // 3 (userId) and 4 (agentId) removed in M04-T06: attribution is derived from
  // the authenticated principal. Reserved rather than reused - a field number
  // is permanent, and an old client sending 4 must not land in a new field.
  reserved 3, 4;
  reserved "userId", "agentId";
  string content = 5;
}

message CreateCommentResponse {
  Comment comment = 1;
}

message ListCommentsRequest {
  string entityId = 1;
  string entityType = 2;
  PageRequest page = 3;
}

message ListCommentsResponse {
  repeated Comment comments = 1;
  PageResponse page = 2;
}

message UpdateCommentRequest {
  string commentId = 1;
  string content = 2;
  // Removed in M04-T06 - authorship is checked against the principal.
  reserved 3, 4;
  reserved "userId", "agentId";
}
message UpdateCommentResponse {
  Comment comment = 1;
}

message DeleteCommentRequest {
  string commentId = 1;
  // Removed in M04-T06 - authorship is checked against the principal.
  reserved 2, 3;
  reserved "userId", "agentId";
}
message DeleteCommentResponse {
  bool success = 1;
}

service CommentService {
  rpc CreateComment(CreateCommentRequest) returns (CreateCommentResponse);
  rpc UpdateComment(UpdateCommentRequest) returns (UpdateCommentResponse);
  rpc DeleteComment(DeleteCommentRequest) returns (DeleteCommentResponse);
  rpc ListComments(ListCommentsRequest) returns (ListCommentsResponse);
}

message TaskNote {
  string id = 1;
  string taskId = 2;
  string agentId = 3;
  string content = 4;
}

message CreateTaskNoteRequest {
  string taskId = 1;
  // Removed in M04-T06 - a task note is authored by the authenticated agent.
  reserved 2;
  reserved "agentId";
  string content = 3;
}

message CreateTaskNoteResponse {
  TaskNote taskNote = 1;
}

message ListTaskNotesRequest {
  string taskId = 1;
  PageRequest page = 2;
}

message ListTaskNotesResponse {
  repeated TaskNote taskNotes = 1;
  PageResponse page = 2;
}

message UpdateTaskNoteRequest {
  string taskNoteId = 1;
  string content = 2;
}
message UpdateTaskNoteResponse {
  TaskNote taskNote = 1;
}

message DeleteTaskNoteRequest {
  string taskNoteId = 1;
}
message DeleteTaskNoteResponse {
  bool success = 1;
}

service TaskNoteService {
  rpc CreateTaskNote(CreateTaskNoteRequest) returns (CreateTaskNoteResponse);
  rpc UpdateTaskNote(UpdateTaskNoteRequest) returns (UpdateTaskNoteResponse);
  rpc DeleteTaskNote(DeleteTaskNoteRequest) returns (DeleteTaskNoteResponse);
  rpc ListTaskNotes(ListTaskNotesRequest) returns (ListTaskNotesResponse);
}

