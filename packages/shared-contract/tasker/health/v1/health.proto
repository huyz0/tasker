syntax = "proto3";

package tasker.health.v1;

option go_package = "github.com/huyz0/tasker/apps/cli/gen/tasker/health/v1";

message PingRequest {}

message PingResponse {
  string message = 1;
  string dbStatus = 2;
  string natsStatus = 3;
  string version = 4;
  int32 uptimeSeconds = 5;
  int32 dbLatencyMs = 6;
  int32 natsLatencyMs = 7;
}

service HealthService {
  rpc Ping(PingRequest) returns (PingResponse);
}

message User {
  string id = 1;
  string email = 2;
  string name = 3;
  string avatarUrl = 4;
  string createdAt = 5;
  // M13: the stable local handle. See main.tsp's User model for the
  // empty-string-means-absent convention this shares with email/name.
  string username = 6;
}

message Organization {
  string id = 1;
  string name = 2;
  string slug = 3;
  string role = 4;
  string parentOrgId = 5;
  string deletedAt = 6;
  int32 binRetentionDays = 7;
}

message GetIdentityRequest {}
message GetIdentityResponse {
  User user = 1;
}

// M13-T06. See main.tsp's SetPasswordRequest for the currentPassword /
// last-sign-in-method reasoning.
message SetPasswordRequest {
  string currentPassword = 1;
  string newPassword = 2;
}
message SetPasswordResponse {
  bool success = 1;
}

// M13-T08. See main.tsp for why linking itself is an HTTP redirect flow, not
// an RPC - these two cover list/remove only.
message LinkedIdentity {
  string provider = 1;
  string linkedAt = 2;
}
message ListLinkedIdentitiesRequest {}
message ListLinkedIdentitiesResponse {
  repeated LinkedIdentity identities = 1;
  // M13-T12. See main.tsp for why this is exposed here.
  bool hasPassword = 2;
}
message UnlinkIdentityRequest {
  string provider = 1;
}
message UnlinkIdentityResponse {
  bool success = 1;
}

// M13-T10. See main.tsp for the assertOrgAdmin + membership-check reasoning.
message AdminResetPasswordRequest {
  string orgId = 1;
  string userId = 2;
}
message AdminResetPasswordResponse {
  bool success = 1;
  string temporaryPassword = 2;
}

service AuthService {
  rpc GetIdentity(GetIdentityRequest) returns (GetIdentityResponse);
  rpc SetPassword(SetPasswordRequest) returns (SetPasswordResponse);
  rpc ListLinkedIdentities(ListLinkedIdentitiesRequest) returns (ListLinkedIdentitiesResponse);
  rpc UnlinkIdentity(UnlinkIdentityRequest) returns (UnlinkIdentityResponse);
  rpc AdminResetPassword(AdminResetPasswordRequest) returns (AdminResetPasswordResponse);
}

message ListOrgsRequest {
  PageRequest page = 1;
  bool onlyDeleted = 2;
}
message ListOrgsResponse {
  repeated Organization organizations = 1;
  PageResponse page = 2;
  // Parents of this page's organizations that did not fit on it (M03-T09).
  repeated Organization ancestors = 3;
}

message ArchiveOrgRequest {
  string orgId = 1;
}
message ArchiveOrgResponse {
  bool success = 1;
}

message RestoreOrgRequest {
  string orgId = 1;
}
message RestoreOrgResponse {
  bool success = 1;
}

message PurgeOrgRequest {
  string orgId = 1;
}
message PurgeOrgResponse {
  bool success = 1;
}

message SetOrgRetentionDaysRequest {
  string orgId = 1;
  int32 binRetentionDays = 2;
}
message SetOrgRetentionDaysResponse {
  bool success = 1;
}

message SeedOrgRequest {
  string name = 1;
  string slug = 2;
  string parentOrgId = 3;
}
message SeedOrgResponse {
  Organization organization = 1;
}

message InviteUserRequest {
  string orgId = 1;
  optional string email = 2;
  optional string role = 3;
  // M13-T09. Exactly one of email/username is required.
  optional string username = 4;
}
message InviteUserResponse {
  bool success = 1;
}

message UpdateOrgRequest {
  string orgId = 1;
  optional string name = 2;
  optional string slug = 3;
}
message UpdateOrgResponse {
  Organization organization = 1;
}

message OrgMember {
  string userId = 1;
  string email = 2;
  string name = 3;
  string role = 4;
}

// An outstanding invitation (M03-T12).
message Invitation {
  string id = 1;
  string org_id = 2;
  string email = 3;
  string role = 4;
  string invited_by = 5;
  string created_at = 6;
  string expires_at = 7;
  bool expired = 8;
  // M13-T09. See main.tsp's Invitation model for the exactly-one-of-
  // email/username reasoning.
  string username = 9;
}

message ListInvitationsRequest {
  string orgId = 1;
  PageRequest page = 2;
}

message ListInvitationsResponse {
  repeated Invitation invitations = 1;
  PageResponse page = 2;
}

message RevokeInvitationRequest {
  string invitationId = 1;
}

message RevokeInvitationResponse {
  bool success = 1;
}

message ListOrgMembersRequest {
  string orgId = 1;
  PageRequest page = 2;
  // Server-side role facet (M03-T08).
  string role = 3;
}
message ListOrgMembersResponse {
  repeated OrgMember members = 1;
  PageResponse page = 2;
}

message RemoveOrgMemberRequest {
  string orgId = 1;
  string userId = 2;
}
message RemoveOrgMemberResponse {
  bool success = 1;
}

message UpdateOrgMemberRoleRequest {
  string orgId = 1;
  string userId = 2;
  string role = 3;
}
message UpdateOrgMemberRoleResponse {
  OrgMember member = 1;
}

service OrgService {
  rpc ListOrgs(ListOrgsRequest) returns (ListOrgsResponse);
  rpc SeedOrg(SeedOrgRequest) returns (SeedOrgResponse);
  rpc UpdateOrg(UpdateOrgRequest) returns (UpdateOrgResponse);
  rpc ArchiveOrg(ArchiveOrgRequest) returns (ArchiveOrgResponse);
  rpc RestoreOrg(RestoreOrgRequest) returns (RestoreOrgResponse);
  rpc PurgeOrg(PurgeOrgRequest) returns (PurgeOrgResponse);
  rpc SetOrgRetentionDays(SetOrgRetentionDaysRequest) returns (SetOrgRetentionDaysResponse);
  rpc InviteUser(InviteUserRequest) returns (InviteUserResponse);
  rpc ListInvitations(ListInvitationsRequest) returns (ListInvitationsResponse);
  rpc RevokeInvitation(RevokeInvitationRequest) returns (RevokeInvitationResponse);
  rpc ListOrgMembers(ListOrgMembersRequest) returns (ListOrgMembersResponse);
  rpc RemoveOrgMember(RemoveOrgMemberRequest) returns (RemoveOrgMemberResponse);
  rpc UpdateOrgMemberRole(UpdateOrgMemberRoleRequest) returns (UpdateOrgMemberRoleResponse);
}

message TaskType {
  string id = 1;
  string orgId = 2;
  string projectId = 3;
  string name = 4;
  string createdAt = 5;
  string parentId = 6;
}

message TaskStatus {
  string id = 1;
  string taskTypeId = 2;
  string name = 3;
  // Statuses are a pipeline, not a set. Without this the order is whatever the
  // database returns, which puts "done" wherever it likes (M05-T09).
  int32 position = 4;
}

message TaskStatusTransition {
  string id = 1;
  string taskTypeId = 2;
  string fromStatusId = 3;
  string toStatusId = 4;
}

message GetTaskTypeRequest {
  string id = 1;
}

message GetTaskTypeResponse {
  TaskType taskType = 1;
  repeated TaskStatus statuses = 2;
  repeated TaskStatusTransition transitions = 3;
}

message CreateTaskTypeRequest {
  string orgId = 1;
  string projectId = 2;
  string name = 3;
  string parentId = 4;
}

message CreateTaskTypeResponse {
  TaskType taskType = 1;
}

message ListTaskTypesRequest {
  string orgId = 1;
  PageRequest page = 2;
}

message ListTaskTypesResponse {
  repeated TaskType taskTypes = 1;
  PageResponse page = 2;
}

message CreateTaskStatusRequest {
  string taskTypeId = 1;
  string name = 2;
}

message CreateTaskStatusResponse {
  TaskStatus status = 1;
}

message CreateTaskStatusTransitionRequest {
  string taskTypeId = 1;
  string fromStatusId = 2;
  string toStatusId = 3;
}

message CreateTaskStatusTransitionResponse {
  TaskStatusTransition transition = 1;
}

// The complete list, in the new order. A partial list is rejected: leaving the
// unnamed statuses at their old positions is how two of them end up sharing
// one.
message ReorderTaskStatusesRequest {
  string taskTypeId = 1;
  repeated string statusIds = 2;
}

message ReorderTaskStatusesResponse {
  repeated TaskStatus statuses = 1;
}

// The type is named as well as the edge so the request can be authorized even
// when the edge is already gone. Looking the edge up first and returning early
// would hand back success for any id at all, without an authorization check.
message DeleteTaskStatusTransitionRequest {
  string transitionId = 1;
  string taskTypeId = 2;
}

message DeleteTaskStatusTransitionResponse {
  bool success = 1;
}

message UpdateTaskTypeRequest {
  string id = 1;
  optional string name = 2;
  optional string parentId = 3;
}
message UpdateTaskTypeResponse {
  TaskType taskType = 1;
}

service TaskTypeService {
  rpc GetTaskType(GetTaskTypeRequest) returns (GetTaskTypeResponse);
  rpc CreateTaskType(CreateTaskTypeRequest) returns (CreateTaskTypeResponse);
  rpc UpdateTaskType(UpdateTaskTypeRequest) returns (UpdateTaskTypeResponse);
  rpc ListTaskTypes(ListTaskTypesRequest) returns (ListTaskTypesResponse);
  rpc CreateTaskStatus(CreateTaskStatusRequest) returns (CreateTaskStatusResponse);
  rpc CreateTaskStatusTransition(CreateTaskStatusTransitionRequest) returns (CreateTaskStatusTransitionResponse);
  rpc DeleteTaskStatusTransition(DeleteTaskStatusTransitionRequest) returns (DeleteTaskStatusTransitionResponse);
  rpc ReorderTaskStatuses(ReorderTaskStatusesRequest) returns (ReorderTaskStatusesResponse);
}

message ProjectTemplate {
  string id = 1;
  string orgId = 2;
  string name = 3;
  string description = 4;
  string rootTaskTypeId = 5;
}

message Project {
  string id = 1;
  string orgId = 2;
  string templateId = 3;
  string name = 4;
  string ownerId = 5;
  string deletedAt = 6;
  string key = 7;

  // M16-T01: no description field existed anywhere on a project.
  string description = 8;
}

message GetProjectTemplateRequest {
  string id = 1;
}

message GetProjectTemplateResponse {
  ProjectTemplate template = 1;
}

message CreateProjectTemplateRequest {
  string orgId = 1;
  string name = 2;
  string description = 3;
  string rootTaskTypeId = 4;
}

message CreateProjectTemplateResponse {
  ProjectTemplate template = 1;
}

message ListProjectTemplatesRequest {
  string orgId = 1;
  PageRequest page = 2;
}

message ListProjectTemplatesResponse {
  repeated ProjectTemplate templates = 1;
  PageResponse page = 2;
}

message UpdateProjectTemplateRequest {
  string id = 1;
  optional string name = 2;
  optional string description = 3;
  optional string rootTaskTypeId = 4;
}
message UpdateProjectTemplateResponse {
  ProjectTemplate template = 1;
}

service ProjectTemplateService {
  rpc GetTemplate(GetProjectTemplateRequest) returns (GetProjectTemplateResponse);
  rpc CreateTemplate(CreateProjectTemplateRequest) returns (CreateProjectTemplateResponse);
  rpc UpdateTemplate(UpdateProjectTemplateRequest) returns (UpdateProjectTemplateResponse);
  rpc ListTemplates(ListProjectTemplatesRequest) returns (ListProjectTemplatesResponse);
}

message GetProjectRequest {
  string id = 1;
}

message GetProjectResponse {
  Project project = 1;
}

message CreateProjectRequest {
  string orgId = 1;
  string templateId = 2;
  string name = 3;
  string ownerId = 4;
  string description = 5;
}

message CreateProjectResponse {
  Project project = 1;
}

message ListProjectsRequest {
  string orgId = 1;
  PageRequest page = 2;
  bool onlyDeleted = 3;
}

message ListProjectsResponse {
  repeated Project projects = 1;
  PageResponse page = 2;
}

message ArchiveProjectRequest {
  string projectId = 1;
}
message ArchiveProjectResponse {
  bool success = 1;
}

message RestoreProjectRequest {
  string projectId = 1;
}
message RestoreProjectResponse {
  bool success = 1;
}

message PurgeProjectRequest {
  string projectId = 1;
}
message PurgeProjectResponse {
  bool success = 1;
}

message UpdateProjectRequest {
  string projectId = 1;
  string name = 2;

  // Real presence, not the "" -> unset squash UpdateTaskRequest used to do
  // (M14-T01) - unset means "don't touch", explicit empty means "clear it".
  optional string description = 3;
}
message UpdateProjectResponse {
  Project project = 1;
}

service ProjectService {
  rpc GetProject(GetProjectRequest) returns (GetProjectResponse);
  rpc CreateProject(CreateProjectRequest) returns (CreateProjectResponse);
  rpc UpdateProject(UpdateProjectRequest) returns (UpdateProjectResponse);
  rpc ListProjects(ListProjectsRequest) returns (ListProjectsResponse);
  rpc ArchiveProject(ArchiveProjectRequest) returns (ArchiveProjectResponse);
  rpc RestoreProject(RestoreProjectRequest) returns (RestoreProjectResponse);
  rpc PurgeProject(PurgeProjectRequest) returns (PurgeProjectResponse);
}

message AgentRole {
  string id = 1;
  string name = 2;
  string system_prompt = 3;
  string capabilities = 4;
  // A role belongs to exactly one organization (ADR-0007).
  string org_id = 5;
}

message Agent {
  string id = 1;
  string org_id = 2;
  string agent_role_id = 3;
  string name = 4;
  string deletedAt = 5;
}

message CreateAgentRoleRequest {
  string name = 1;
  string system_prompt = 2;
  string capabilities = 3;
  string org_id = 4;
}

message CreateAgentRoleResponse {
  AgentRole role = 1;
}

message ListAgentRolesRequest {
  PageRequest page = 1;
  string org_id = 2;
}

message ListAgentRolesResponse {
  repeated AgentRole roles = 1;
  PageResponse page = 2;
}

message UpdateAgentRoleRequest {
  string id = 1;
  optional string name = 2;
  optional string system_prompt = 3;
  optional string capabilities = 4;
}
message UpdateAgentRoleResponse {
  AgentRole role = 1;
}

message CreateAgentRequest {
  string org_id = 1;
  string agent_role_id = 2;
  string name = 3;
}

message CreateAgentResponse {
  Agent agent = 1;
}

message UpdateAgentRequest {
  string agentId = 1;
  optional string name = 2;
  optional string agent_role_id = 3;
}
message UpdateAgentResponse {
  Agent agent = 1;
}

service AgentService {
  rpc CreateAgentRole(CreateAgentRoleRequest) returns (CreateAgentRoleResponse);
  rpc UpdateAgentRole(UpdateAgentRoleRequest) returns (UpdateAgentRoleResponse);
  rpc ListAgentRoles(ListAgentRolesRequest) returns (ListAgentRolesResponse);
  rpc CreateAgent(CreateAgentRequest) returns (CreateAgentResponse);
  rpc UpdateAgent(UpdateAgentRequest) returns (UpdateAgentResponse);
  rpc ListAgents(ListAgentsRequest) returns (ListAgentsResponse);
  rpc ArchiveAgent(ArchiveAgentRequest) returns (ArchiveAgentResponse);
  rpc RestoreAgent(RestoreAgentRequest) returns (RestoreAgentResponse);
  rpc PurgeAgent(PurgeAgentRequest) returns (PurgeAgentResponse);
  rpc CreateAgentToken(CreateAgentTokenRequest) returns (CreateAgentTokenResponse);
  rpc ListAgentTokens(ListAgentTokensRequest) returns (ListAgentTokensResponse);
  rpc RevokeAgentToken(RevokeAgentTokenRequest) returns (RevokeAgentTokenResponse);
}

message ListAgentsRequest {
  string org_id = 1;
  bool onlyDeleted = 2;
  PageRequest page = 3;
}

message ListAgentsResponse {
  repeated Agent agents = 1;
  PageResponse page = 2;
}

message ArchiveAgentRequest {
  string agentId = 1;
}
message ArchiveAgentResponse {
  bool success = 1;
}

message RestoreAgentRequest {
  string agentId = 1;
}
message RestoreAgentResponse {
  bool success = 1;
}

message PurgeAgentRequest {
  string agentId = 1;
}
message PurgeAgentResponse {
  bool success = 1;
}

// ==== Agent Token Models (ADR-0008) ====

// Never carries the secret. The plaintext exists only in CreateAgentTokenResponse.
message AgentToken {
  string id = 1;
  string agentId = 2;
  string org_id = 3;
  string name = 4;
  // First characters of the plaintext ("tskr_a1b2"), enough to match a token
  // against a leaked string without being usable as one.
  string tokenPrefix = 5;
  repeated string scopes = 6;
  string createdAt = 7;
  string expiresAt = 8;
  string lastUsedAt = 9;
  string revokedAt = 10;
  // Computed server-side rather than left to each client's clock and timezone.
  bool expired = 11;
}

message CreateAgentTokenRequest {
  string agentId = 1;
  string name = 2;
  repeated string scopes = 3;
  int32 expiresInDays = 4;
}

message CreateAgentTokenResponse {
  AgentToken token = 1;
  // The only time the secret is ever returned. It is not stored and cannot be
  // shown again.
  string plaintext = 2;
}

message ListAgentTokensRequest {
  string agentId = 1;
}

message ListAgentTokensResponse {
  repeated AgentToken tokens = 1;
}

message RevokeAgentTokenRequest {
  string tokenId = 1;
}

message RevokeAgentTokenResponse {
  bool success = 1;
}

// Who a task is assigned to. Exactly one of userId/agentId is set; the display
// name is resolved server-side so a client does not need the member and agent
// catalogues to render a task list (M05-T04).
message Assignee {
  string userId = 1;
  string agentId = 2;
  string name = 3;
}

message Task {
  string id = 1;
  string project_id = 2;
  string title = 3;
  string status = 4;
  string description = 5;
  string deletedAt = 6;
  string display_id = 7;
  string task_type_id = 8;
  string created_by = 9;
  // task_assignments has stored these since M01 and nothing could read them,
  // so the GUI showed a hardcoded avatar instead (M05-T02).
  repeated Assignee assignees = 10;
}

message UnassignTaskRequest {
  string task_id = 1;
  string agent_id = 2;
  string user_id = 3;
}

message UnassignTaskResponse {
  bool success = 1;
}

message CreateTaskRequest {
  string project_id = 1;
  string title = 2;
  string status = 3;
  string description = 4;
  string task_type_id = 5;

  // Retry-safety (M14-T07): replaying the same key from the same principal
  // returns the original response instead of creating a second task.
  string idempotencyKey = 6;
}

message CreateTaskResponse {
  Task task = 1;
}

message AssignTaskRequest {
  string task_id = 1;
  string agent_id = 2;
  string user_id = 3;
}

message AssignTaskResponse {
  bool success = 1;
}

// Agent self-service (M14-T06): claims the task for the calling principal
// only - no field names a different assignee. Succeeds only if the task
// currently has no assignee at all.
message ClaimTaskRequest {
  string task_id = 1;

  // Retry-safety (M14-T07), same contract as CreateTaskRequest.idempotencyKey.
  string idempotencyKey = 2;
}

message ClaimTaskResponse {
  Task task = 1;
}

message TaskReviewer {
  string id = 1;
  string task_id = 2;
  string user_id = 3;
  // Resolved server-side, for the same reason Assignee.name is: otherwise a
  // client must hold the member catalogue to render a name, and fetching that
  // catalogue is what made the first assignee picker issue 2,000 requests
  // (M05-T04).
  string name = 4;
}

message AddTaskReviewerRequest {
  string task_id = 1;
  string user_id = 2;
}
message AddTaskReviewerResponse {
  bool success = 1;
}

message RemoveTaskReviewerRequest {
  string task_id = 1;
  string user_id = 2;
}
message RemoveTaskReviewerResponse {
  bool success = 1;
}

message ListTaskReviewersRequest {
  string task_id = 1;
}
message ListTaskReviewersResponse {
  repeated TaskReviewer reviewers = 1;
}

message PageRequest {
  int32 limit = 1;
  string cursor = 2;
  string filter = 3;
  string sort = 4;
}

message PageResponse {
  string next_cursor = 1;
  int32 total_count = 2;
}

// One task, with the fields the list deliberately leaves out. listTasks
// projects `description` away — it is unbounded free text and a list renders
// only titles (M07-T01).
message GetTaskRequest {
  string taskId = 1;
}

message GetTaskResponse {
  Task task = 1;
}

message ListTasksRequest {
  string project_id = 1;
  PageRequest page = 2;
  bool onlyDeleted = 3;

  // One board column's worth of tasks. The board used to fetch the whole
  // project and group in the browser; with this facet each column is its own
  // paginated list and page.totalCount is that column's real count (M07-T03).
  string status = 4;

  // Agent self-service (M14-T05): "unassigned" finds claimable work, "me"
  // resolves to the calling principal server-side. Unset returns every task.
  string assigneeFilter = 5;
}

message ListTasksResponse {
  repeated Task tasks = 1;
  PageResponse page = 2;
}

message UpdateTaskStatusRequest {
  string taskId = 1;
  string status = 2;
}

message UpdateTaskStatusResponse {
  Task task = 1;
}

message UpdateTaskRequest {
  string taskId = 1;
  optional string title = 2;
  optional string description = 3;
  optional string taskTypeId = 4;
}
message UpdateTaskResponse {
  Task task = 1;
}

message DeleteTaskRequest {
  string taskId = 1;
}

message DeleteTaskResponse {
  bool success = 1;
}

message RestoreTaskRequest {
  string taskId = 1;
}

message RestoreTaskResponse {
  bool success = 1;
}

message PurgeTaskRequest {
  string taskId = 1;
}

message PurgeTaskResponse {
  bool success = 1;
}

service TaskService {
  rpc CreateTask(CreateTaskRequest) returns (CreateTaskResponse);
  rpc AssignTask(AssignTaskRequest) returns (AssignTaskResponse);
  rpc UnassignTask(UnassignTaskRequest) returns (UnassignTaskResponse);
  rpc ClaimTask(ClaimTaskRequest) returns (ClaimTaskResponse);
  rpc GetTask(GetTaskRequest) returns (GetTaskResponse);
  rpc ListTasks(ListTasksRequest) returns (ListTasksResponse);
  rpc UpdateTask(UpdateTaskRequest) returns (UpdateTaskResponse);
  rpc UpdateTaskStatus(UpdateTaskStatusRequest) returns (UpdateTaskStatusResponse);
  rpc DeleteTask(DeleteTaskRequest) returns (DeleteTaskResponse);
  rpc RestoreTask(RestoreTaskRequest) returns (RestoreTaskResponse);
  rpc PurgeTask(PurgeTaskRequest) returns (PurgeTaskResponse);
  rpc AddTaskReviewer(AddTaskReviewerRequest) returns (AddTaskReviewerResponse);
  rpc RemoveTaskReviewer(RemoveTaskReviewerRequest) returns (RemoveTaskReviewerResponse);
  rpc ListTaskReviewers(ListTaskReviewersRequest) returns (ListTaskReviewersResponse);
}

message Folder {
  string id = 1;
  string projectId = 2;
  string parentId = 3;
  string name = 4;
  string deletedAt = 5;
}

message Artifact {
  string id = 1;
  string folderId = 2;
  string name = 3;
  string description = 4;

  // Empty on ListArtifacts, populated by GetArtifactContent. The body is
  // base64 and can reach ~15 MB, so returning it per row made a folder
  // listing proportional to the size of its files rather than the number of
  // them (M07-T02).
  string content = 5;

  string deletedAt = 6;
  string contentType = 7;

  // Length of the stored body, so a client can tell how big an artifact is
  // without transferring it. The stored length, not a decoded one: uploads are
  // base64 and editor text is not, and the content type does not reliably say
  // which.
  int64 sizeBytes = 8;
}

// A deep link carries an artifact id and nothing else. Without this, the GUI
// located the artifact by walking every folder in the project and every page of
// each — O(folders x pages) requests to find one row (M07-T12).
message GetArtifactRequest {
  string artifactId = 1;
}

message GetArtifactResponse {
  Artifact artifact = 1;
}

message GetArtifactContentRequest {
  string artifactId = 1;
}

message GetArtifactContentResponse {
  string content = 1;
  string contentType = 2;
  int64 sizeBytes = 3;
}

message TaskArtifactLink {
  string id = 1;
  string taskId = 2;
  string artifactId = 3;
  // Both names are resolved server-side, for the same reason Assignee.name and
  // TaskReviewer.name are. Here the argument is stronger: artifact rows carry
  // their whole `content`, so a client resolving names itself would download
  // every artifact body just to render a list of titles.
  string artifactName = 4;
  string taskTitle = 5;
}

message CreateFolderRequest {
  string projectId = 1;
  string parentId = 2;
  string name = 3;
}

message CreateFolderResponse {
  Folder folder = 1;
}

message UpdateFolderRequest {
  string folderId = 1;
  string name = 2;
}
message UpdateFolderResponse {
  Folder folder = 1;
}

message CreateArtifactRequest {
  string folderId = 1;
  string name = 2;
  string description = 3;
  string content = 4;
  string contentType = 5;
}

message CreateArtifactResponse {
  Artifact artifact = 1;
}

message UpdateArtifactContentRequest {
  string artifactId = 1;
  string content = 2;
  optional string contentType = 3;
}

message UpdateArtifactContentResponse {
  Artifact artifact = 1;
}

message LinkTaskArtifactRequest {
  string taskId = 1;
  string artifactId = 2;
}

message LinkTaskArtifactResponse {
  TaskArtifactLink link = 1;
}

message UnlinkTaskArtifactRequest {
  string taskId = 1;
  string artifactId = 2;
}

message UnlinkTaskArtifactResponse {
  bool success = 1;
}

// One relation read from either end. Exactly one of the two ids must be set;
// two RPCs for one table would mean two authorization paths and two entries in
// each deny-by-default sweep.
message ListTaskArtifactLinksRequest {
  optional string taskId = 1;
  optional string artifactId = 2;
}

message ListTaskArtifactLinksResponse {
  repeated TaskArtifactLink links = 1;
}

message ListArtifactsRequest {
  // One of folderId or projectId. The folder is the browsing case; the project
  // is the Bin, which wants every deleted artifact regardless of where it
  // lived (M07-T04).
  string folderId = 1;
  PageRequest page = 2;
  bool onlyDeleted = 3;
  string projectId = 4;
}

message ListArtifactsResponse {
  repeated Artifact artifacts = 1;
  PageResponse page = 2;
}

message ListFoldersRequest {
  string projectId = 1;
  PageRequest page = 2;
  bool onlyDeleted = 3;
}

message ListFoldersResponse {
  repeated Folder folders = 1;
  PageResponse page = 2;
}

message ArchiveArtifactRequest {
  string artifactId = 1;
}
