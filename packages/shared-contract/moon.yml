$schema: https://moonrepo.dev/schemas/project.json
language: system

tasks:
  # Nothing here installs node modules for us: every project is
  # `language: system`, and moon 2's toolchain plugins are not configured, so
  # `pipeline.installDependencies` has nothing to act on. Every JS-consuming
  # task in the workspace depends on this one, which is why it lives in a
  # project whose id is stable - moon derives the ROOT project's id from the
  # checkout directory name, so a `root:`/`tasker:` target breaks in any clone
  # not named that. Runs at the workspace root, where the single lockfile is.
  install-deps:
    command: 'bun install --cwd $workspaceRoot'
    inputs:
      - '/package.json'
      - '/bun.lock'
      - '/apps/*/package.json'
      - '/packages/*/package.json'

  # M12-T03. Every RPC's request and response through the real wire format,
  # enumerated from the descriptor rather than listed by hand so a new service
  # is covered the moment it is generated. Until this existed, nothing in the
  # repository ever serialized a contract message: the GUI mocks the generated
  # module and the backend calls handlers directly.
  test:
    deps:
      - 'shared-contract:install-deps'
      - 'shared-contract:compile'
    command: 'bun test contract.roundtrip.test.ts'
    inputs:
      - 'contract.roundtrip.test.ts'
      - 'gen/**/*'

  format:
    deps:
      - 'shared-contract:install-deps'
    command: 'bunx tsp format --check "**/*.tsp"'
    inputs:
      - '**/*.tsp'

  compile:
    deps:
      - 'shared-contract:install-deps'
    script: 'bunx tsp compile main.tsp && bunx buf generate'
    inputs:
      - '**/*.tsp'
      # buf generates from the checked-in .proto, not from tsp-output (which
      # buf.yaml excludes). Leaving it out of the inputs meant editing the proto
      # did not invalidate the cache, so `moon run compile` reported success and
      # regenerated nothing.
      - 'tasker/**/*.proto'
      - 'buf.yaml'
      - 'buf.gen.yaml'
      - 'package.json'
    outputs:
      - 'tsp-output'
      - 'gen'
