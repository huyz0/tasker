tasks:
  test:
    deps:
      - 'shared-contract:install-deps'
    command: 'bun run test'
    inputs:
      - 'src/**/*'
      - '**/*.test.ts'
  test-integration:
    deps:
      - 'shared-contract:install-deps'
    command: 'bun run test:integration'
    inputs:
      - 'src/**/*'
      - '**/*.integration.test.ts'
  # M12-T02. The real server as its own process, driven by the real generated
  # client. Separate again: it binds a port and spawns a process, which is a
  # different prerequisite from a broker or a token.
  test-wire:
    deps:
      - 'shared-contract:install-deps'
    command: 'bun run test:wire'
    inputs:
      - 'src/**/*'

  # M08-T11. Separate from `test-integration` because it needs a broker rather
  # than a GitHub token — different prerequisite, so a missing one must skip
  # only its own half.
  test-integration-realtime:
    deps:
      - 'shared-contract:install-deps'
    command: 'bun run test:integration-realtime'
    inputs:
      - 'src/**/*'
      - '**/*.integration.test.ts'
  # The M08 event consumer. `type: run` so it stays out of `moon check` —
  # it is a long-lived process that needs a broker, not a gate.
  consumer:
    type: 'run'
    deps:
      - 'shared-contract:install-deps'
    command: 'bun run src/consumers/index.ts'

  build:
    deps:
      - 'shared-contract:install-deps'
    command: 'bun build ./src/index.ts --target bun --outdir dist'
  build-standalone:
    deps:
      - 'shared-contract:install-deps'
      # The binary carries the GUI, so the GUI has to exist first (M09-T02).
      # Without this the bundler exits non-zero rather than quietly compiling
      # a binary that serves a blank page.
      - 'gui:build'
    command: 'bun run build:standalone'
    inputs:
      - 'src/**/*'
      - 'scripts/**/*'
      - 'drizzle-sqlite/**/*'
    outputs:
      - 'dist/tasker-standalone'
  # Regenerates the embedded migration list. Run after adding a migration;
  # `embeddedMigrations.test.ts` fails until you do.
  generate-migrations:
    type: 'run'
    command: 'bun run generate:migrations'
  lint:
    deps:
      - 'shared-contract:install-deps'
    command: 'bun run lint'
    inputs:
      - 'src/**/*'
      - 'package.json'

  # The compiler as a gate, mirroring `gui:typecheck`. `bun test` transpiles
  # per-file and never type-checks, so nothing here caught a type error until
  # this task existed - the generated contract is an input because a regenerated
  # RPC signature is exactly the change this is meant to catch.
  typecheck:
    deps:
      - 'shared-contract:install-deps'
    command: 'bunx tsc --noEmit'
    inputs:
      - 'src/**/*'
      - 'tsconfig.json'
      - '/packages/shared-contract/gen/**/*'
