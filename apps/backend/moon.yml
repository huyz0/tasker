tasks:
  test:
    deps:
      - 'shared-contract:install-deps'
    command: 'bun run test'
    inputs:
      - 'src/**/*'
      - '**/*.test.ts'
  test-integration:
    deps:
      - 'shared-contract:install-deps'
    command: 'bun run test:integration'
    inputs:
      - 'src/**/*'
      - '**/*.integration.test.ts'
  # M08-T11. Separate from `test-integration` because it needs a broker rather
  # than a GitHub token — different prerequisite, so a missing one must skip
  # only its own half.
  test-integration-realtime:
    deps:
      - 'shared-contract:install-deps'
    command: 'bun run test:integration-realtime'
    inputs:
      - 'src/**/*'
      - '**/*.integration.test.ts'
  # The M08 event consumer. `type: run` so it stays out of `moon check` —
  # it is a long-lived process that needs a broker, not a gate.
  consumer:
    type: 'run'
    deps:
      - 'shared-contract:install-deps'
    command: 'bun run src/consumers/index.ts'

  build:
    deps:
      - 'shared-contract:install-deps'
    command: 'bun build ./src/index.ts --target bun --outdir dist'
  build-standalone:
    deps:
      - 'shared-contract:install-deps'
    command: 'bun run build:standalone'
    inputs:
      - 'src/**/*'
    outputs:
      - 'dist/tasker-standalone'
  lint:
    deps:
      - 'shared-contract:install-deps'
    command: 'bun run lint'
    inputs:
      - 'src/**/*'
      - 'package.json'
