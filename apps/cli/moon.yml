$schema: https://moonrepo.dev/schemas/project.json
language: system

dependsOn:
  - shared-contract

tasks:
  format:
    command: 'bash scripts/check-format.sh'
    inputs:
      - '**/*.go'
      - 'scripts/check-format.sh'

  vet:
    command: 'go vet ./...'
    inputs:
      - '**/*.go'
      - 'go.mod'
      - 'go.sum'

  # ./... not ./cmd/... - internal/backend holds the client, the auth
  # interceptor and credential resolution, and its tests existed but were never
  # run by this gate. Found in M04-T09 when a new test file compiled locally and
  # the gate reported green without having built it.
  test:
    # `./...` stays as the package list so every package still compiles and
    # runs (that is what this gate is for, per the note above), but coverage
    # is scoped to hand-written code with -coverpkg.
    #
    # Without it the profile counted `gen/tasker/**` — the generated protobuf
    # and connect stubs — and 2,665 of 2,710 measured functions were generated
    # getters nobody tests. The reported figure was 6.9%, which is true and
    # useless: the same run measures 94.4% over cmd/ and internal/. A number
    # that low reads as "untested" and gets ignored, which is how it drifted
    # from a cached 97.9% to 6.9% without anyone noticing.
    command: 'go test -v -coverprofile=coverage.out -coverpkg=./cmd/...,./internal/... ./...'
    inputs:
      - '**/*.go'
      - 'go.mod'
      - 'go.sum'

  coverage:
    command: 'go tool cover -func=coverage.out'
    inputs:
      - 'coverage.out'
    deps:
      - test

  build:
    command: 'go build -v ./...'
    inputs:
      - '**/*.go'
      - 'go.mod'
      - 'go.sum'

  # A runnable binary named what the documentation calls it (M12-T08).
  # `go build ./...` compiles every package and writes nothing you can run;
  # this is the one that produces `apps/cli/tasker`.
  build-binary:
    command: 'go build -o tasker .'
    inputs:
      - '**/*.go'
      - 'go.mod'
      - 'go.sum'
    outputs:
      - 'tasker'

  # M12-T06. `coverage` prints the number; this fails when it drops.
  # 80% is the milestone's bar and the figure today is 94.4%, so the gate is a
  # ratchet against a slide rather than a stretch.
  #
  # Runs the profile itself rather than depending on `cli:test`'s. A cached
  # `cli:test` writes no file, and declaring `coverage.out` as its output makes
  # moon fail the task outright — `go test` rewrites the profile once per
  # package, so what survives the run is not what moon expects to cache.
  coverage-gate:
    command: 'bash scripts/check-coverage.sh 80'
    inputs:
      - '**/*.go'
      - 'go.mod'
      - 'go.sum'
      - 'scripts/check-coverage.sh'
