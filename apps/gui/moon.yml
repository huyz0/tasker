$schema: https://moonrepo.dev/schemas/project.json
language: system

dependsOn:
  - shared-contract

tasks:
  lint:
    command: 'bun run lint'
    inputs:
      - 'src/**/*'
      - 'package.json'

  typecheck:
    command: 'bunx tsc --noEmit'
    inputs:
      - 'src/**/*'
      - 'tsconfig.json'

  test:
    command: 'bun run test:coverage'
    inputs:
      - 'src/**/*'
      - 'vitest.config.ts'
      - 'package.json'

  # Drives a real browser against a real backend, so its result depends on
  # state moon cannot see (a running server and its database) - caching a pass
  # would mean skipping the run that actually proves anything.
  e2e:
    command: 'bun run test:e2e'
    inputs:
      - 'src/**/*'
      - 'tests/e2e/**/*'
      - 'playwright.config.ts'
      - 'package.json'
    options:
      cache: false

  build:
    command: 'bun run build'
    inputs:
      - 'src/**/*'
      - 'index.html'
      - 'vite.config.*'
      - 'package.json'
      - 'bun.lockb'
    outputs:
      - 'dist'
