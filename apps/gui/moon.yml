$schema: https://moonrepo.dev/schemas/project.json
language: system

dependsOn:
  - shared-contract

tasks:
  lint:
    deps:
      - 'shared-contract:install-deps'
    command: 'bun run lint'
    inputs:
      - 'src/**/*'
      - 'package.json'
      - '/packages/shared-contract/gen/**/*'

  typecheck:
    deps:
      - 'shared-contract:install-deps'
    command: 'bunx tsc --noEmit'
    inputs:
      - 'src/**/*'
      - 'tsconfig.json'
      - '/packages/shared-contract/gen/**/*'

  # Design rules were prose in ui-ux-standard.md and drifted to 47 raw palette
  # values, 4 WCAG contrast failures and no reduced-motion handling. Zero
  # dependencies, so it needs no install step and runs in milliseconds.
  # The gate's own tests run first. design-lint decides whether the GUI ships
  # and had none - DESIGN_LINT_ROOT existed as a testing seam no test used,
  # which is a gate trusted on faith (M05-T01).
  design-lint:
    script: 'node scripts/design-lint.test.mjs && node scripts/design-lint.mjs'
    inputs:
      - 'src/**/*'
      - 'scripts/design-lint.mjs'
      - 'scripts/design-lint.test.mjs'

  # M05's first exit criterion, kept true rather than audited once: every RPC in
  # the contract is called by the GUI or excepted with a reason. The case that
  # matters is the next RPC — one added later and reachable only from the CLI is
  # the defect this milestone existed to remove (M05-T12). The contract is an
  # input, so adding an RPC invalidates the cache.
  rpc-coverage:
    script: 'node scripts/rpc-coverage.test.mjs && node scripts/rpc-coverage.mjs'
    inputs:
      - 'src/**/*'
      - 'scripts/rpc-coverage.mjs'
      - 'scripts/rpc-coverage.test.mjs'
      - '/packages/shared-contract/main.tsp'

  # M06-T11, kept true rather than swept once: every view that reads can say the
  # read failed. Before this, every `isError` in `features/*` was a *mutation* —
  # a failed list fell through to its empty branch and claimed the data was gone.
  # The case that matters is the next view, which would inherit the same shape.
  query-error-coverage:
    script: 'node scripts/query-error-coverage.test.mjs && node scripts/query-error-coverage.mjs'
    inputs:
      - 'src/features/**/*'
      - 'scripts/query-error-coverage.mjs'
      - 'scripts/query-error-coverage.test.mjs'

  test:
    deps:
      - 'shared-contract:install-deps'
    command: 'bun run test:coverage'
    inputs:
      - 'src/**/*'
      - 'vitest.config.ts'
      - 'package.json'
      - '/packages/shared-contract/gen/**/*'

  # Drives a real browser against a real backend, so its result depends on
  # state moon cannot see (a running server and its database) - caching a pass
  # would mean skipping the run that actually proves anything.
  #
  # `type: run` keeps it out of `moon check`, which is what the pre-commit hook
  # invokes: a commit must not require a booted backend and installed browsers.
  # The CI job runs it explicitly (`moon run gui:e2e`) after seeding one.
  e2e:
    deps:
      - 'shared-contract:install-deps'
    type: 'run'
    command: 'bun run test:e2e'
    inputs:
      - 'src/**/*'
      - 'tests/e2e/**/*'
      - 'playwright.config.ts'
      - 'package.json'
    options:
      cache: false
      # `type: run` implies runInCI: false, which made `moon run gui:e2e` in the
      # CI job exit with "No tasks found" - the target is filtered out when CI
      # is set. The type is here to keep e2e out of `moon check`, not out of CI.
      runInCI: true

  # The browser-free half of M06-T13: everything that would quietly turn the
  # a11y gate back into one that cannot fail — the addon reset to `todo`, a
  # missing `process.exit(1)`, `runInCI` dropped, CI no longer calling it. Cheap
  # and cached, so it runs in `moon check` where the four-minute gate cannot.
  storybook-a11y-config:
    script: 'node scripts/storybook-a11y.test.mjs'
    inputs:
      - 'scripts/storybook-a11y.mjs'
      - 'scripts/storybook-a11y.test.mjs'
      - '.storybook/preview.tsx'
      - 'moon.yml'
      - '/.github/workflows/ci.yml'

  # The browser-free half of the mobile-overflow gate, same trade as
  # storybook-a11y-config above: cheap and cached, so it can run in
  # `moon check` where the browser gate below cannot.
  mobile-overflow-config:
    script: 'node scripts/mobile-overflow.test.mjs'
    inputs:
      - 'scripts/mobile-overflow.mjs'
      - 'scripts/mobile-overflow.test.mjs'
      - 'moon.yml'
      - '/.github/workflows/ci.yml'

  # Runs axe, then the 375px overflow check, over every story in a real
  # browser — one Storybook build shared by both. `type: run` for the same
  # reason as e2e: it launches chromium, and a commit must not require
  # installed browsers. CI runs it explicitly.
  #
  # A real browser is the whole point — `color-contrast` and layout overflow
  # both need one. axe reports contrast as `incomplete` under jsdom, and
  # jsdom's zero-size bounding rects mean nothing could ever be measured as
  # overflowing (M06-T13, and the finding that added mobile-overflow.mjs).
  storybook-test:
    deps:
      - 'shared-contract:install-deps'
    type: 'run'
    script: 'bunx storybook build -o storybook-static --quiet && node scripts/storybook-a11y.mjs && node scripts/mobile-overflow.mjs'
    inputs:
      - 'src/**/*'
      - '.storybook/**/*'
      - 'scripts/storybook-a11y.mjs'
      - 'scripts/mobile-overflow.mjs'
      - 'package.json'
    options:
      cache: false
      runInCI: true

  build:
    deps:
      - 'shared-contract:install-deps'
    command: 'bun run build'
    inputs:
      - 'src/**/*'
      - 'index.html'
      - 'vite.config.*'
      - 'package.json'
      - '/packages/shared-contract/gen/**/*'
      # The workspace's single lockfile lives at the repo root (see
      # dependency-standard.md); this used to name a bun.lockb that never
      # existed here, so dependency changes did not invalidate the build.
      - '/bun.lock'
    outputs:
      - 'dist'
