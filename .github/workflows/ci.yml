name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  contract:
    name: Shared Contract (TypeSpec)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 'latest'
      - name: Setup Moon
        uses: moonrepo/setup-toolchain@v0
      - name: Install dependencies
        run: cd packages/shared-contract && bun install
      - name: Compile and Format (Cached)
        run: moon run shared-contract:format shared-contract:compile

  # knip gates unused files, dependencies and exports. It ran only through
  # `moon check` (the pre-commit hook) until now, which meant a pull request
  # authored without the hook installed could add dead code and still merge.
  workspace:
    name: Workspace (knip)
    runs-on: ubuntu-latest
    needs: contract
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 'latest'
      - name: Setup Moon
        uses: moonrepo/setup-toolchain@v0
      - name: Unused code and dependencies
        run: moon run :knip
      - name: Agent harness contract
        run: moon run :skills-check :docs-lint
      - name: Specification drift
        run: moon run :spec-drift

  gui:
    name: GUI (React/Vite)
    runs-on: ubuntu-latest
    needs: contract
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # needed for moon affected
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 'latest'
      - name: Setup Moon
        uses: moonrepo/setup-toolchain@v0
      - name: Install dependencies
        run: |
          # Install shared contract first so it can compile
          cd packages/shared-contract && bun install && cd ../..
          cd apps/gui && bun install
      # gui:test is `vitest run --coverage`, so this gates merges on both the
      # suite passing and the 95% coverage thresholds in vitest.config.ts.
      - name: Build & Test (Cached)
        run: moon run gui:lint gui:design-lint gui:typecheck gui:test gui:build
      # Storybook's a11y addon is set to `test: 'error'`, which only means
      # something if something runs the stories. This does, in a real browser,
      # so `color-contrast` can actually be evaluated (M06-T13) — and, since
      # the same run already has a browser and every story rendered, it also
      # checks that nothing overflows a 375px viewport without a scroller to
      # reach it through.
      - name: Install Playwright browser
        run: cd apps/gui && bunx playwright install --with-deps chromium
      - name: Storybook a11y + mobile overflow
        run: moon run gui:storybook-test

  gui-e2e:
    name: GUI E2E (Playwright)
    runs-on: ubuntu-latest
    needs: contract
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 'latest'
      - name: Setup Moon
        uses: moonrepo/setup-toolchain@v0
      - name: Install dependencies
        run: |
          cd packages/shared-contract && bun install && cd ../..
          cd apps/backend && bun install && cd ../..
          cd apps/gui && bun install
      - name: Install Playwright browsers
        run: cd apps/gui && bunx playwright install --with-deps chromium
      # The specs drive the real product, not a mock: they need a backend that
      # answers RPCs and a database with enough rows to click on. The seed also
      # makes the GUI's dev user a member of the seeded org, so the browser
      # session sees the data without any manual token handling.
      - name: Seed the database and start the backend
        run: |
          cd apps/backend
          bun run seed
          STANDALONE=true ENABLE_TEST_LOGIN=true nohup bun run src/index.ts > backend.log 2>&1 &
          for _ in $(seq 1 30); do
            curl -sf -o /dev/null http://localhost:8080/api/auth/session && exit 0
            sleep 1
          done
          echo "backend did not come up in 30s"; cat backend.log; exit 1
      # Playwright's own webServer block starts the GUI dev server.
      - name: E2E
        run: moon run gui:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/gui/playwright-report/
          retention-days: 7

  backend:
    name: Backend (Bun)
    runs-on: ubuntu-latest
    needs: contract
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 'latest'
      - name: Setup Moon
        uses: moonrepo/setup-toolchain@v0
      - name: Install dependencies
        run: |
          cd packages/shared-contract && bun install && cd ../..
          cd apps/backend && bun install
      - name: Build & Test (Cached)
        run: moon run backend:test

  audit:
    name: Dependency vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 'latest'
      - name: Install dependencies
        run: bun install
      # A ratchet: fails on any high or critical advisory that is not on the
      # accepted list in the script, each with a reason and the route it
      # reaches us by. New ones break the build; the ones already present —
      # none fixable from here — do not leave the job permanently red.
      - name: Audit JavaScript dependencies
        run: ./scripts/audit-dependencies.sh
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: apps/cli/go.mod
      # The CLI is a separate ecosystem with its own advisory database, and
      # `govulncheck` reports only vulnerabilities in code paths that are
      # actually reachable — so a finding here is a finding, not a transitive
      # coincidence.
      - name: Audit Go dependencies
        working-directory: apps/cli
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          "$(go env GOPATH)/bin/govulncheck" ./...

  standalone:
    name: Standalone binary (smoke)
    runs-on: ubuntu-latest
    needs: contract
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 'latest'
      - name: Setup Moon
        uses: moonrepo/setup-toolchain@v0
      - name: Install dependencies
        run: |
          cd packages/shared-contract && bun install && cd ../..
          cd apps/gui && bun install && cd ../..
          cd apps/backend && bun install
      # Builds the GUI too, via the task's own dependency — a binary compiled
      # without it serves a blank page, which is exactly what the smoke script
      # below refuses to accept.
      - name: Build the binary
        run: moon run backend:build-standalone
      # Runs it from a temporary directory with a scrubbed environment, so
      # nothing it needs can come from the checkout it was built in.
      - name: Smoke test it
        run: ./scripts/smoke-standalone.sh

  cli:
    name: CLI (Go)
    runs-on: ubuntu-latest
    needs: contract
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
      # Read the version from go.mod rather than naming a floating '1.26':
      # a minor-version wildcard silently drifts to whatever Go released last,
      # so CI stops testing the toolchain `moon setup` gives developers.
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: apps/cli/go.mod
          cache-dependency-path: apps/cli/go.sum
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 'latest'
      - name: Setup Moon
        uses: moonrepo/setup-toolchain@v0
      - name: Setup Shared Contract
        run: cd packages/shared-contract && bun install
      - name: Build & Test (Cached)
        run: moon run cli:format cli:vet cli:test cli:build cli:coverage-gate
