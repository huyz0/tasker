name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# Superseded PR checks are replaceable; every main commit keeps its own proof.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  contract:
    name: Shared Contract (TypeSpec)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Setup pinned Node
        uses: ./.github/actions/setup-node
      - name: Setup Bun
        uses: ./.github/actions/setup-bun
      - name: Setup Moon
        uses: ./.github/actions/setup-moon
      - name: Install dependencies
        run: cd packages/shared-contract && bun install
      - name: Compile and Format (Cached)
        run: moon run shared-contract:format shared-contract:compile

  # knip gates unused files, dependencies and exports. It ran only through
  # `moon check` (the pre-commit hook) until now, which meant a pull request
  # authored without the hook installed could add dead code and still merge.
  workspace:
    name: Workspace (knip)
    runs-on: ubuntu-latest
    needs: contract
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Setup pinned Node
        uses: ./.github/actions/setup-node
      - name: Setup Bun
        uses: ./.github/actions/setup-bun
      - name: Setup Moon
        uses: ./.github/actions/setup-moon
      - name: Unused code and dependencies
        run: moon run :knip
      - name: Agent harness contract
        run: moon run :skills-check :docs-lint
      - name: Specification drift
        run: moon run :spec-drift :doc-drift

  gui:
    name: GUI (React/Vite)
    runs-on: ubuntu-latest
    needs: contract
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # needed for moon affected
      - name: Setup pinned Node
        uses: ./.github/actions/setup-node
      - name: Setup Bun
        uses: ./.github/actions/setup-bun
      - name: Setup Moon
        uses: ./.github/actions/setup-moon
      - name: Install dependencies
        run: |
          # Install shared contract first so it can compile
          cd packages/shared-contract && bun install && cd ../..
          cd apps/gui && bun install
      # gui:test is `vitest run --coverage`, so this gates merges on both the
      # suite passing and the 95% coverage thresholds in vitest.config.ts.
      - name: Build & Test (Cached)
        run: moon run gui:lint gui:design-lint gui:typecheck gui:test gui:build
      # Storybook's a11y addon is set to `test: 'error'`, which only means
      # something if something runs the stories. This does, in a real browser,
      # so `color-contrast` can actually be evaluated (M06-T13) — and, since
      # the same run already has a browser and every story rendered, it also
      # checks that nothing overflows a 375px viewport without a scroller to
      # reach it through.
      - name: Install Playwright browser
        run: cd apps/gui && bunx playwright install --with-deps chromium
      - name: Storybook a11y + mobile overflow
        run: moon run gui:storybook-test

  gui-e2e:
    name: GUI E2E (Playwright)
    runs-on: ubuntu-latest
    needs: contract
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Setup pinned Node
        uses: ./.github/actions/setup-node
      - name: Setup Bun
        uses: ./.github/actions/setup-bun
      - name: Setup Moon
        uses: ./.github/actions/setup-moon
      - name: Install dependencies
        run: |
          cd packages/shared-contract && bun install && cd ../..
          cd apps/backend && bun install && cd ../..
          cd apps/gui && bun install
      - name: Install Playwright browsers
        run: cd apps/gui && bunx playwright install --with-deps chromium
      # The specs drive the real product, not a mock: they need a backend that
      # answers RPCs and a database with enough rows to click on. The seed also
      # makes the GUI's dev user a member of the seeded org, so the browser
      # session sees the data without any manual token handling.
      - name: Seed the database and start the backend
        run: |
          cd apps/backend
          bun run seed
          STANDALONE=true ENABLE_TEST_LOGIN=true nohup bun run src/index.ts > backend.log 2>&1 &
          for _ in $(seq 1 30); do
            curl -sf -o /dev/null http://localhost:8080/api/auth/session && exit 0
            sleep 1
          done
          echo "backend did not come up in 30s"; cat backend.log; exit 1
      # Playwright's own webServer block starts the GUI dev server.
      - name: Reports section locations
        run: cd apps/gui && bunx playwright test tests/e2e/reports.spec.ts --grep "section locations" --workers=1 --retries=0
      - name: Saved-view browser types
        run: cd apps/gui && bun run typecheck:e2e:saved-views
      - name: Prove native saved-view intent regression
        run: cd apps/gui && bun run test:e2e:saved-view-proof
      - name: Prove claim-history current-page cursor invariant
        run: cd apps/gui && bun run test:e2e:claim-cursor-proof
      - name: E2E
        run: moon run gui:e2e
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/gui/playwright-report/
          retention-days: 7

  backend:
    name: Backend (Bun)
    runs-on: ubuntu-latest
    needs: contract
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Setup pinned Node
        uses: ./.github/actions/setup-node
      - name: Setup Bun
        uses: ./.github/actions/setup-bun
      - name: Setup Moon
        uses: ./.github/actions/setup-moon
      - name: Install dependencies
        run: |
          cd packages/shared-contract && bun install && cd ../..
          cd apps/backend && bun install
      - name: Owned fixture cleanup regressions
        run: cd apps/backend && bun test src/test/ownedCleanup.test.ts
      - name: Build & Test (Cached)
        run: moon run backend:typecheck backend:typecheck-measurement backend:test

  audit:
    name: Dependency vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup Bun
        uses: ./.github/actions/setup-bun
      - name: Install dependencies
        run: bun install
      # A ratchet: fails on any high or critical advisory that is not on the
      # accepted list in the script, each with a reason and the route it
      # reaches us by. New ones break the build; the ones already present —
      # none fixable from here — do not leave the job permanently red.
      - name: Audit JavaScript dependencies
        run: ./scripts/audit-dependencies.sh
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: apps/cli/go.mod
      # The CLI is a separate ecosystem with its own advisory database, and
      # `govulncheck` reports only vulnerabilities in code paths that are
      # actually reachable — so a finding here is a finding, not a transitive
      # coincidence.
      - name: Audit Go dependencies
        working-directory: apps/cli
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          "$(go env GOPATH)/bin/govulncheck" ./...

  standalone:
    name: Standalone binary (smoke)
    runs-on: ubuntu-latest
    needs: contract
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Setup pinned Node
        uses: ./.github/actions/setup-node
      - name: Setup Bun
        uses: ./.github/actions/setup-bun
      - name: Setup Moon
        uses: ./.github/actions/setup-moon
      - name: Install dependencies
        run: |
          cd packages/shared-contract && bun install && cd ../..
          cd apps/gui && bun install && cd ../..
          cd apps/backend && bun install
      # Builds the GUI too, via the task's own dependency — a binary compiled
      # without it serves a blank page, which is exactly what the smoke script
      # below refuses to accept.
      - name: Build the binary
        run: moon run backend:build-standalone
      # Runs it from a temporary directory with a scrubbed environment, so
      # nothing it needs can come from the checkout it was built in.
      - name: Smoke test it
        run: ./scripts/smoke-standalone.sh
      - name: Retain tested standalone binary
        uses: actions/upload-artifact@v4
        with:
          name: standalone-smoke-${{ github.sha }}
          path: apps/backend/dist/tasker-standalone
          retention-days: 14
          if-no-files-found: error

  cli:
    name: CLI (Go)
    runs-on: ubuntu-latest
    needs: contract
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Setup pinned Node
        uses: ./.github/actions/setup-node
      # Read the version from go.mod rather than naming a floating '1.26':
      # a minor-version wildcard silently drifts to whatever Go released last,
      # so CI stops testing the toolchain `moon setup` gives developers.
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: apps/cli/go.mod
          cache-dependency-path: apps/cli/go.sum
      - name: Setup Bun
        uses: ./.github/actions/setup-bun
      - name: Setup Moon
        uses: ./.github/actions/setup-moon
      - name: Setup Shared Contract
        run: cd packages/shared-contract && bun install
      - name: Build & Test (Cached)
        run: moon run cli:format cli:vet cli:test cli:build cli:coverage-gate cli:docs-check

      # Runtime/configuration changes must exercise the exact repository gate,
      # in addition to the independently executed browser and integration jobs.
      - name: Detect runtime or CI configuration changes
        id: runtime-pins
        env:
          TASKER_PIN_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ ! "$TASKER_PIN_BASE_SHA" =~ ^[0-9a-f]{40}$ ]] || ! git cat-file -e "$TASKER_PIN_BASE_SHA^{commit}"; then
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          elif git diff --quiet "$TASKER_PIN_BASE_SHA" HEAD -- .prototools apps/cli/go.mod .github/actions .github/workflows; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Full repository checks for runtime changes
        if: steps.runtime-pins.outputs.changed == 'true'
        env:
          VITEST_MAX_WORKERS: '1'
          MOON_CONCURRENCY: '1'
          GOMAXPROCS: '2'
        run: |
          mkdir -p "$RUNNER_TEMP/tasker-gates"
          {
            git rev-parse HEAD
            node --version
            bun --version
            moon --version
            go version
          } > "$RUNNER_TEMP/tasker-gates/toolchains.txt"
          set -o pipefail
          moon check --all 2>&1 | tee "$RUNNER_TEMP/tasker-gates/moon-check-all.log"
      - name: Retain exact repository gate report
        if: always() && steps.runtime-pins.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: repository-gate-${{ github.sha }}
          path: ${{ runner.temp }}/tasker-gates/
          retention-days: 30
          if-no-files-found: error

  mysql-native:
    name: MySQL native (${{ matrix.mysql }})
    runs-on: ubuntu-latest
    needs: contract
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        mysql: ['8.0', '8.4']
    services:
      mysql:
        image: mysql:${{ matrix.mysql }}
        env:
          # Disposable service credentials, never a production database.
          MYSQL_ROOT_PASSWORD: tasker-native-ci
          MYSQL_ROOT_HOST: '%'
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --host=127.0.0.1 --user=root --password=tasker-native-ci"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_USER: root
      DB_PASSWORD: tasker-native-ci
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Setup pinned Node
        uses: ./.github/actions/setup-node
      - name: Setup Bun
        uses: ./.github/actions/setup-bun
      - name: Setup Moon
        uses: ./.github/actions/setup-moon
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Required native MySQL cases
        run: moon run backend:test-mysql
      - name: Prove native claim failures block the command
        run: cd apps/backend && bun run test:mysql-claim-proof

      - name: Prepare owned recovery broker image
        run: docker pull nats:2.10-alpine
      - name: Required MySQL cross-process recovery
        env:
          TASKER_MYSQL_SERVICE_CONTAINER: ${{ job.services.mysql.id }}
        run: moon run backend:test-recovery-mysql
      - name: Prove empty backup fails the restored identity oracle
        run: cd apps/backend && bun run test:recovery:backup-proof
      - name: Prove killed consumer reaches the recovery observer
        run: cd apps/backend && bun run test:recovery:observer-proof
      - name: Prove acknowledged audit loss and duplicates fail
        run: cd apps/backend && bun run test:recovery:audit-proof

  measurement-core:
    name: Bounded measurement core (Bun)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Setup Bun
        uses: ./.github/actions/setup-bun
      # Pure Bun tests: no generated contract, SQL, broker or package install.
      # Keep their feedback independent of the contract/service job queues.
      - name: Bounded measurement core regressions
        run: cd apps/backend && bun test src/test/concurrencyMeasurement.test.ts
      - name: Prove unchecked inputs fail
        run: cd apps/backend && bun run prove:measurement-core

  measurement-smoke:
    name: Bounded HTTP measurement (smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: tasker-native-ci
          MYSQL_ROOT_HOST: '%'
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --host=127.0.0.1 --user=root --password=tasker-native-ci"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_USER: root
      DB_PASSWORD: tasker-native-ci
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Setup pinned Node
        uses: ./.github/actions/setup-node
      - name: Setup Bun
        uses: ./.github/actions/setup-bun
      - name: Setup Moon
        uses: ./.github/actions/setup-moon
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Real stalled-RPC deadline and cancellation regressions
        working-directory: apps/backend
        run: bun test src/test/measurementTransport.test.ts
      - name: Prove real stalled-RPC deadline and cancellation oracles
        working-directory: apps/backend
        run: bun run prove:measurement-transport
      - name: Measurement script types
        run: moon run backend:typecheck-measurement
      - name: Prepare owned broker image
        run: docker pull nats:2.10-alpine
      - name: Real HTTP smoke and observed-report contract
        working-directory: apps/backend
        run: |
          mkdir -p "$RUNNER_TEMP/tasker-load"
          bun run measure:concurrency --concurrency 4 --duration 3 --fixture 20 --instances 2 --seed 42 --max-operations 20 > "$RUNNER_TEMP/tasker-load/smoke.json"
          bun -e 'const r = JSON.parse(await Bun.file(process.env.RUNNER_TEMP + "/tasker-load/smoke.json").text()); if (!r.correctness?.ok || !r.evidenceValid || r.cleanupFailures !== 0 || r.timing?.setupMs <= 0 || r.timing?.totalMs <= r.timing?.phaseMs || r.timing?.cleanupMs < 0 || new Set(r.workload?.apiPids).size !== 2 || r.workload?.actualPrincipals !== 4 || r.workload?.fixtureTasks !== 20 || r.counts?.completedLogical < 1 || Object.values(r.counts.errors).some(n => n !== 0) || r.queue?.samples < 1 || r.memory?.apiPeakRssBytes <= 0 || !r.versions?.mysql || !r.versions?.nats) throw new Error("The smoke report lacks required positive observations.");'
      - name: Prove late SQL commits cannot escape the outcome oracle
        working-directory: apps/backend
        run: bun run prove:measurement-quiescence
      - name: Show aggregate measurement evidence
        if: always()
        run: |
          if [ -s "$RUNNER_TEMP/tasker-load/smoke.json" ]; then
            cat "$RUNNER_TEMP/tasker-load/smoke.json"
          fi
      - name: Retain machine-readable measurement evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: load-smoke-${{ github.sha }}
          path: ${{ runner.temp }}/tasker-load/*.json
          retention-days: 14
          if-no-files-found: error
