name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  contract:
    name: Shared Contract (TypeSpec)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 'latest'
      - name: Setup Moon
        uses: moonrepo/setup-toolchain@v0
      - name: Install dependencies
        run: cd packages/shared-contract && bun install
      - name: Compile and Format (Cached)
        run: moon run shared-contract:format shared-contract:compile

  gui:
    name: GUI (React/Vite)
    runs-on: ubuntu-latest
    needs: contract
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # needed for moon affected
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 'latest'
      - name: Setup Moon
        uses: moonrepo/setup-toolchain@v0
      - name: Install dependencies
        run: |
          # Install shared contract first so it can compile
          cd packages/shared-contract && bun install && cd ../..
          cd apps/gui && bun install
      # gui:test is `vitest run --coverage`, so this gates merges on both the
      # suite passing and the 95% coverage thresholds in vitest.config.ts.
      - name: Build & Test (Cached)
        run: moon run gui:lint gui:typecheck gui:test gui:build

  gui-e2e:
    name: GUI E2E (Playwright)
    runs-on: ubuntu-latest
    needs: contract
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 'latest'
      - name: Setup Moon
        uses: moonrepo/setup-toolchain@v0
      - name: Install dependencies
        run: |
          cd packages/shared-contract && bun install && cd ../..
          cd apps/backend && bun install && cd ../..
          cd apps/gui && bun install
      - name: Install Playwright browsers
        run: cd apps/gui && bunx playwright install --with-deps chromium
      # The specs drive the real product, not a mock: they need a backend that
      # answers RPCs and a database with enough rows to click on. The seed also
      # makes the GUI's dev user a member of the seeded org, so the browser
      # session sees the data without any manual token handling.
      - name: Seed the database and start the backend
        run: |
          cd apps/backend
          bun run seed
          STANDALONE=true ENABLE_TEST_LOGIN=true nohup bun run src/index.ts > backend.log 2>&1 &
          for _ in $(seq 1 30); do
            curl -sf -o /dev/null http://localhost:8080/api/auth/session && exit 0
            sleep 1
          done
          echo "backend did not come up in 30s"; cat backend.log; exit 1
      # Playwright's own webServer block starts the GUI dev server.
      - name: E2E
        run: moon run gui:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/gui/playwright-report/
          retention-days: 7

  backend:
    name: Backend (Bun)
    runs-on: ubuntu-latest
    needs: contract
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 'latest'
      - name: Setup Moon
        uses: moonrepo/setup-toolchain@v0
      - name: Install dependencies
        run: |
          cd packages/shared-contract && bun install && cd ../..
          cd apps/backend && bun install
      - name: Build & Test (Cached)
        run: moon run backend:test

  cli:
    name: CLI (Go)
    runs-on: ubuntu-latest
    needs: contract
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
      # Read the version from go.mod rather than naming a floating '1.26':
      # a minor-version wildcard silently drifts to whatever Go released last,
      # so CI stops testing the toolchain `moon setup` gives developers.
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: apps/cli/go.mod
          cache-dependency-path: apps/cli/go.sum
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 'latest'
      - name: Setup Moon
        uses: moonrepo/setup-toolchain@v0
      - name: Setup Shared Contract
        run: cd packages/shared-contract && bun install
      - name: Build & Test (Cached)
        run: moon run cli:format cli:vet cli:test cli:build
