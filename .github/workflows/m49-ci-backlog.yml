name: M49 superseded-check cleanup

on:
  pull_request:
    branches: ["main"]
    paths:
      - '.github/workflows/m49-ci-backlog.yml'
      - '.github/scripts/m49-ci-backlog.mjs'

permissions: {}

jobs:
  cancel-known-obsolete-runs:
    if: github.event.pull_request.number == 19 && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feature/m49-bounded-load'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v6
      - name: Setup Bun
        uses: ./.github/actions/setup-bun
      - name: Cancel only verified obsolete task runs
        env:
          TASKER_ACTIONS_TOKEN: ${{ github.token }}
          TASKER_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: bun run .github/scripts/m49-ci-backlog.mjs
