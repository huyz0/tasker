name: Setup pinned Moon
description: Install the Moon version recorded in the repository toolchain file.
runs:
  using: composite
  steps:
    - name: Read repository Moon pin
      id: pin
      shell: bash
      run: |
        moon_version=$(sed -nE 's/^moon[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' .prototools)
        [[ "$moon_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
        printf 'version=%s\n' "$moon_version" >> "$GITHUB_OUTPUT"
    - name: Install pinned Moon
      uses: moonrepo/setup-toolchain@v0
      with:
        moon-version: ${{ steps.pin.outputs.version }}
