$schema: https://moonrepo.dev/schemas/toolchain.json

# These versions MUST match `.prototools`, which is what actually installs the
# toolchain here: every project is `language: system`, so commands resolve
# through proto's shims and moon 2 reports "no toolchains are configured" for
# the deprecated platform keys below. They were left behind at node 22.14.0 /
# bun 1.0.30 / go 1.22.0 long after `.prototools` moved on - a stale copy of a
# pinned version is worse than none, so they are kept in step here until the
# workspace migrates to moon 2's toolchain plugins.
node:
  version: "24.12.0"
  packageManager: "bun"
bun:
  version: "1.3.11"
